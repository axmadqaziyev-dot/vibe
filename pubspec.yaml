name: flutter_application_1
description: VIBE social application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  shared_preferences: any
  image_picker: any
  supabase_flutter: any
  flutter_webrtc: any
  just_audio: any
  video_player: any
  record: any
  cross_file: any
  path_provider: any
  web: any
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.0.4
  firebase_analytics: ^12.1.0
  flutter_local_notifications: ^22.3.1
  image: ^4.10.1
  http: ^1.5.0
  url_launcher: any
  geolocator: any
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  fake_cloud_firestore: ^4.3.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/chime.wav

# Tətbiq ikonu: əvvəlcə `flutter test test/app_icon_test.dart`,
# sonra `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: "assets/icon/vibe_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0714"
  adaptive_icon_foreground: "assets/icon/vibe_icon_foreground.png"
  web:
    generate: true
    background_color: "#0B0714"
    theme_color: "#FF2BD6"
  windows:
    generate: true
